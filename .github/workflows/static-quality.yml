name: Static quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-quality:
    name: static-quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python syntax
        run: |
          python - <<'PY'
          import pathlib, py_compile, sys
          failures=[]
          for p in pathlib.Path('.').rglob('*.py'):
              if any(part in {'.git','.venv','venv','node_modules'} for part in p.parts):
                  continue
              try: py_compile.compile(str(p), doraise=True)
              except Exception as e: failures.append(f'{p}: {e}')
          if failures:
              print('\n'.join(failures)); sys.exit(1)
          print('Python syntax OK')
          PY
      - name: Validate notebooks and JSON files
        run: |
          python - <<'PY'
          import json, pathlib, sys
          failures=[]
          for p in list(pathlib.Path('.').rglob('*.ipynb')) + list(pathlib.Path('.').rglob('*.json')):
              if any(part in {'.git','.venv','venv','node_modules'} for part in p.parts): continue
              try: json.loads(p.read_text(encoding='utf-8'))
              except Exception as e: failures.append(f'{p}: {e}')
          if failures:
              print('\n'.join(failures)); sys.exit(1)
          print('Notebook/JSON validation OK')
          PY
      - name: Run lightweight tests when available
        run: |
          python -m pip install --disable-pip-version-check -q pytest
          if find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) -not -path './.git/*' | grep -q .; then
            pytest -q --disable-warnings --maxfail=1
          else
            echo 'No test files found; static checks completed.'
          fi
